<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Symmetrical Harmonograph</title>
  <style>
	body {
	  margin: 0;
	  font-family: ui-monospace;
	  font-size: .8em;
	  display: flex;
	  height: 100vh;
	  background: #fff;
	}

	#sidebar {
	  width: 300px;
	  padding: 10px;
	  background-color: #fafafa;
	  overflow-y: auto;
	  box-sizing: border-box;
	}

	#main {
	  flex: 1;
	  display: flex;
	  flex-direction: column;
	  align-items: center;
	  justify-content: center;
	  background: #fff;
	  overflow: hidden;
	}

	#svgContainer {
	  display: flex;
	  align-items: center;
	  justify-content: center;
	  overflow: hidden;
	  width: 100%;
	  height: 100%;
	}

	.param-group {
	  margin-bottom: 10px;
	}

	label {
	  display: inline-block;
	  margin-right:1em;
	  width:4em;
	}

	.freq-set {
	  margin-bottom: 10px;
	}

	.freq-set h3 {
	  margin-top: 0;
	  font-size:1em;
	}

	button {
	  margin-top: 10px;
	  margin-bottom: 20px;
	  -webkit-appearance: none;
	  border:1px solid black;
	  font-size:1em;
	  border-radius: 4px;
	  background: transparent;
	  font-family: ui-monospace;
	  padding:4px 12px;
	  cursor: pointer;
	  font-weight: 600;
	}

	/* Input styling: no border, transparent background */
	input[type=number] {
	  border: none;
	  background: transparent;
	  width: 50px;
	  text-align: right;
	  font-family: ui-monospace;
	  font-size:0.9em;
	  outline: none;
	  margin-right:5px;
	}

	/* Remove spinners from number input */
	input[type=number]::-webkit-outer-spin-button,
	input[type=number]::-webkit-inner-spin-button {
	  -webkit-appearance: none;
	  margin:0;
	}

	/* Range styling */
	input[type=range] {
	  -webkit-appearance: none;
	  background: transparent;
	  height:1em;
	  margin-left:5px;
	  margin-top:5px;
	  width: 100%;
	  display: inline-flex;
	}
	.param-group input[type=range] {
		width:100%;
	}

	

	input[type=range]::-webkit-slider-runnable-track {
	  width: 100%;
	  height: 1.5px;
	  cursor: pointer;
	  box-shadow: none;
	  background: black;
	  border-radius: 0;
	  border: 0 none;
	}

	input[type=range]::-webkit-slider-thumb {
	  -webkit-appearance: none;
	  border: 1.5px solid #000000;
	  height: 8px;
	  width: 8px;
	  border-radius: 4px;
	  background: #000;
	  cursor: pointer;
	  margin-top: -3.5px;
	}

	/* Increment/decrement buttons */
	.inc-dec-container {
	  display: inline-block;
	  vertical-align: middle;
	  margin-right:5px;
	  border:1px solid red;
	}

	.inc-dec-wrapper {
	  display:inline-flex;
	  flex-direction:column;
	  vertical-align: middle;
	}

	.inc-dec-wrapper button {
	  display:block;
	  font-size:0.8em;
	  line-height:8px;
	  height:8px;
	  padding:0;
	  border: 0 none;
	  background:transparent;
	  cursor:pointer;
	  width:1.5em;
	  text-align:center;
	  margin:0;
	}
	.param-group {
	  display:flex;
	  align-items:center;
	  margin-bottom:5px;
	  flex-direction: row;
	  width: 100%;
	}
	.param-group input {
		font-size:1em;
		width: 3.1em;
	}


  </style>
</head>
<body>
  <div id="sidebar">
	<h2>Harmonograph</h2>
	<p>Tab between fields for direct input, or adjust slider.</p>
	
	<div class="param-group">
		<label for="d">Damp:</label>
		<input type="number" id="d" min="0.0001" max="0.02" step="0.0001" value="0.005">
		<div class="inc-dec-wrapper">
		  <button class="inc-dec-button" data-target="d" data-direction="up">▴</button>
		  <button class="inc-dec-button" data-target="d" data-direction="down">▾</button>
		</div>
		<input type="range" id="d_range" min="0.0001" max="0.02" step="0.0001" value="0.005">
	</div>

	<div class="param-group">
    <label for="zoom">Zoom:</label>
    <input type="number" id="zoom" min="0.5" max="3" step="0.01" value="1">
    <div class="inc-dec-wrapper">
    <button class="inc-dec-button" data-target="zoom" data-direction="up">▴</button>
    <button class="inc-dec-button" data-target="zoom" data-direction="down">▾</button>
    </div>
	  <input type="range" id="zoom_range" min="0.5" max="3" step="0.01" value="1">
	</div>

	<div id="freqSetsContainer"></div>
	<button id="addFreqSetBtn">+ Add Frequency Set</button>

	<button id="saveSvgBtn">Save SVG</button>
  </div>
  <div id="main">
	<div id="svgContainer">
	  <svg id="harmonograph" width="600" height="600"></svg>
	</div>
  </div>

  <script>
	const svg = document.getElementById("harmonograph");
	const width = svg.getAttribute("width");
	const height = svg.getAttribute("height");

	const dInput = document.getElementById('d');
	const dRange = document.getElementById('d_range');
	const zoomInput = document.getElementById('zoom');
	const zoomRange = document.getElementById('zoom_range');

	const freqSetsContainer = document.getElementById('freqSetsContainer');
	const addFreqSetBtn = document.getElementById('addFreqSetBtn');
	const saveSvgBtn = document.getElementById('saveSvgBtn');

	// Default set: a flower-like pattern
	const defaultSets = [
	  { f1:3.000, f2:4.000, f3:3.000, f4:3.000, p1:000, p2:Math.PI/2, p3:Math.PI/4, p4:Math.PI/3, color:"#ff0000" },
	];

	let freqSets = JSON.parse(JSON.stringify(defaultSets));

	// Common function to create param group with number + inc/dec + range
	function createParamControl(wrapper, labelText, paramName, min, max, step, initialValue, onChange) {
	  const paramGroup = document.createElement('div');
	  paramGroup.className = 'param-group';

	  const label = document.createElement('label');
	  label.textContent = labelText;
	  paramGroup.appendChild(label);

	  const numberInput = document.createElement('input');
	  numberInput.type = 'number';
	  numberInput.min = min;
	  numberInput.max = max;
	  numberInput.step = step;
	  numberInput.value = initialValue;
	  paramGroup.appendChild(numberInput);

	  const incDecWrapper = document.createElement('div');
	  incDecWrapper.className = 'inc-dec-wrapper';

	  const incBtn = document.createElement('button');
	  incBtn.className = 'inc-dec-button';
	  incBtn.textContent = '▴';
	  incBtn.addEventListener('click', () => {
		numberInput.stepUp();
		numberChanged();
	  });
	  incDecWrapper.appendChild(incBtn);

	  const decBtn = document.createElement('button');
	  decBtn.className = 'inc-dec-button';
	  decBtn.textContent = '▾';
	  decBtn.addEventListener('click', () => {
		numberInput.stepDown();
		numberChanged();
	  });
	  incDecWrapper.appendChild(decBtn);

	  paramGroup.appendChild(incDecWrapper);

	  const rangeInput = document.createElement('input');
	  rangeInput.type = 'range';
	  rangeInput.min = min;
	  rangeInput.max = max;
	  rangeInput.step = step;
	  rangeInput.value = initialValue;

	  paramGroup.appendChild(rangeInput);
	  wrapper.appendChild(paramGroup);

	  function numberChanged() {
		// Sync range
		rangeInput.value = numberInput.value;
		onChange(parseFloat(numberInput.value));
	  }

	  function rangeChanged() {
		numberInput.value = rangeInput.value;
		onChange(parseFloat(rangeInput.value));
	  }

	  numberInput.addEventListener('input', numberChanged);
	  rangeInput.addEventListener('input', rangeChanged);
	}

	// We'll adapt the frequency/phase sets now to the new UI:
	function createSetUI(set, index) {
	  const wrapper = document.createElement('div');
	  wrapper.className = 'freq-set';

	  const title = document.createElement('h3');
	  title.textContent = `Frequency Set ${index+1}`;
	  wrapper.appendChild(title);

	  const freqParams = [
		{param:'f1', label:'F1:', min:0.1, max:10, step:0.001},
		{param:'f2', label:'F2:', min:0.1, max:10, step:0.001},
		{param:'f3', label:'F3:', min:0.1, max:10, step:0.001},
		{param:'f4', label:'F4:', min:0.1, max:10, step:0.001},
	  ];
	  freqParams.forEach(f => {
		createParamControl(wrapper, f.label, f.param, f.min, f.max, f.step, set[f.param], val => {
		  set[f.param] = val;
		  drawHarmonograph();
		});
	  });

	  const phaseParams = [
		{param:'p1', label:'P1:', min:0, max:2*Math.PI, step:0.001},
		{param:'p2', label:'P2:', min:0, max:2*Math.PI, step:0.001},
		{param:'p3', label:'P3:', min:0, max:2*Math.PI, step:0.001},
		{param:'p4', label:'P4:', min:0, max:2*Math.PI, step:0.001},
	  ];
	  phaseParams.forEach(p => {
		createParamControl(wrapper, p.label, p.param, p.min, p.max, p.step, set[p.param], val => {
		  set[p.param] = val;
		  drawHarmonograph();
		});
	  });

	  // Color picker (no slider needed)
	  const colorDiv = document.createElement('div');
	  colorDiv.className = 'param-group';
	  const colorLabel = document.createElement('label');
	  colorLabel.textContent = "Color:";
	  const colorInput = document.createElement('input');
	  colorInput.type = 'color';
	  colorInput.value = set.color;
	  colorInput.addEventListener('input', () => {
		set.color = colorInput.value;
		drawHarmonograph();
	  });
	  colorDiv.appendChild(colorLabel);
	  colorDiv.appendChild(colorInput);
	  wrapper.appendChild(colorDiv);

	  if (freqSets.length > 1) {
		const removeBtn = document.createElement('button');
		removeBtn.textContent = "Remove This Set";
		removeBtn.addEventListener('click', () => {
		  freqSets.splice(index,1);
		  renderFreqSets();
		  drawHarmonograph();
		});
		wrapper.appendChild(removeBtn);
	  }

	  return wrapper;
	}

	function renderFreqSets() {
	  freqSetsContainer.innerHTML = '';
	  freqSets.forEach((set, i) => {
		freqSetsContainer.appendChild(createSetUI(set, i));
	  });
	}

	addFreqSetBtn.addEventListener('click', () => {
	  freqSets.push({
		f1:3, f2:3.05, f3:3, f4:2.95,
		p1:0, p2:Math.PI/2, p3:Math.PI/4, p4:Math.PI/3,
		color:"#"+Math.floor(Math.random()*16777215).toString(16)
	  });
	  renderFreqSets();
	  drawHarmonograph();
	});

	function drawHarmonograph() {
	  while (svg.firstChild) {
		svg.removeChild(svg.firstChild);
	  }

	  const d = parseFloat(dInput.value);
	  const computationScale = 100;
	  const steps = 20000;

	  freqSets.forEach(p => {
		let pathData = "";
		for (let i = 0; i <= steps; i++) {
		  const t = i * 0.01;
		  const X = width/2 + (Math.sin(t * p.f1 + p.p1) * Math.exp(-d * t)
							  + Math.sin(t * p.f2 + p.p2) * Math.exp(-d * t)) * computationScale;
		  const Y = height/2 + (Math.sin(t * p.f3 + p.p3) * Math.exp(-d * t)
							  + Math.sin(t * p.f4 + p.p4) * Math.exp(-d * t)) * computationScale;
		  pathData += (i === 0 ? "M" : "L") + X + " " + Y;
		}

		const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
		path.setAttribute("d", pathData);
		path.setAttribute("fill", "none");
		path.setAttribute("stroke", p.color);
		path.setAttribute("stroke-width", "1");
		svg.appendChild(path);
	  });
	}

	// Sync damping
	dInput.addEventListener('input', () => {
	  dRange.value = dInput.value;
	  drawHarmonograph();
	});
	dRange.addEventListener('input', () => {
	  dInput.value = dRange.value;
	  drawHarmonograph();
	});

	// Sync zoom
	zoomInput.addEventListener('input', () => {
	  zoomRange.value = zoomInput.value;
	  applyZoom();
	});
	zoomRange.addEventListener('input', () => {
	  zoomInput.value = zoomRange.value;
	  applyZoom();
	});

	function applyZoom() {
	  const zoomFactor = parseFloat(zoomInput.value);
	  document.getElementById('svgContainer').style.transform = `scale(${zoomFactor})`;
	}

	// Increment/Decrement buttons for top-level params
	document.querySelectorAll('.inc-dec-button').forEach(btn => {
	  btn.addEventListener('click', e => {
		const targetId = btn.getAttribute('data-target');
		const direction = btn.getAttribute('data-direction');
		const input = document.getElementById(targetId);

		if (direction === 'up') {
		  input.stepUp();
		} else {
		  input.stepDown();
		}

		if (targetId === 'd') {
		  dRange.value = input.value;
		  drawHarmonograph();
		} else if (targetId === 'zoom') {
		  zoomRange.value = input.value;
		  applyZoom();
		}
	  });
	});

	// Save SVG functionality
	saveSvgBtn.addEventListener('click', () => {
	  const serializer = new XMLSerializer();
	  let source = serializer.serializeToString(svg);

	  if(!source.match(/^<\?xml/)) {
		source = '<?xml version="1.0" encoding="UTF-8"?>\n' + source;
	  }

	  const blob = new Blob([source], {type: "image/svg+xml;charset=utf-8"});
	  const url = URL.createObjectURL(blob);

	  const link = document.createElement('a');
	  link.href = url;
	  link.download = 'harmonograph.svg';
	  document.body.appendChild(link);
	  link.click();
	  document.body.removeChild(link);
	  URL.revokeObjectURL(url);
	});

	renderFreqSets();
	drawHarmonograph();
  </script>
</body>
</html>
